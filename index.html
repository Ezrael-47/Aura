<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام | AMU</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- پس‌زمینه گرادیانت متحرک -->
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- کانتینر Toast -->
    <div class="toast-container" id="toast-container"></div>
    
    <!-- کانتینر Confetti -->
    <div class="confetti-container" id="confetti-container"></div>

    <div class="auth-container" id="tilt-card">
        <!-- بخش سمت چپ: تصویر و متن -->
        <div class="left-panel">
            <div class="overlay"></div>
            <div class="left-content">
                <div class="logo">AMU</div>
                <a href="#" class="back-btn">بازگشت به سایت <span>&rarr;</span></a>
            </div>
            
            <div class="bottom-content">
                <h2 class="slide-text active">ثبت لحظه‌ها،<br>ساختن خاطرات</h2>
                <div class="dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <!-- بخش سمت راست: فرم‌ها -->
        <div class="right-panel">
            <button class="theme-toggle" id="theme-toggle" title="تغییر تم">🌙</button>

            <!-- فرم ثبت‌نام -->
            <div id="signup-form" class="form-wrapper active">
                <h1>ایجاد حساب کاربری</h1>
                <p class="subtitle">حساب کاربری دارید؟ <a href="#" id="go-to-login">وارد شوید</a></p>

                <form id="actual-signup-form" novalidate>
                    <div class="input-row">
                        <div class="input-group">
                            <input type="text" id="firstname" placeholder=" " required>
                            <label for="firstname">نام</label>
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </span>
                        </div>
                        <div class="input-group">
                            <input type="text" id="lastname" placeholder=" " required>
                            <label for="lastname">نام خانوادگی</label>
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </span>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="email" id="signup-email" placeholder=" " required>
                        <label for="signup-email">ایمیل</label>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                    </div>

                    <div class="input-group password-group">
                        <input type="password" id="signup-password" placeholder=" " required>
                        <label for="signup-password">رمز عبور را وارد کنید</label>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <span class="toggle-password" onclick="togglePassword('signup-password', this)">👁</span>
                    </div>
                    
                    <div class="strength-meter" id="strength-meter">
                        <div class="strength-bar"></div>
                        <div class="strength-text">قدرت رمز: <span>ضعیف</span></div>
                    </div>

                    <label class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"></span>
                        <span class="text">با <a href="#">قوانین و مقررات</a> موافقم</span>
                    </label>

                    <button type="submit" class="submit-btn magnetic">
                        <span class="btn-text">ثبت‌ نام</span>
                        <span class="loader"></span>
                    </button>

                    <!-- اثبات اجتماعی -->
                    <div class="social-proof">
                        <div class="avatars">
                            <span class="avatar" style="background: linear-gradient(135deg, #667eea, #764ba2);">ز</span>
                            <span class="avatar" style="background: linear-gradient(135deg, #f093fb, #f5576c);">م</span>
                            <span class="avatar" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">ع</span>
                            <span class="avatar" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">س</span>
                            <span class="avatar more">+۱۰K</span>
                        </div>
                        <p>بیش از <strong>۱۰,۰۰۰</strong> کاربر به ما پیوستند</p>
                    </div>

                    <div class="divider"><span>یا ثبت‌نام با</span></div>

                    <div class="social-login">
                        <button type="button" class="social-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                            گوگل
                        </button>
                        <button type="button" class="social-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.74 1.51.06 2.76.62 3.58 1.77-3.09 1.91-2.6 5.73.49 7.13-.69 1.73-1.59 3.43-2.74 4.01zm-3.08-14.1c.56-2.05 2.22-3.44 3.79-3.38.26 1.96-1.6 3.58-3.79 3.38z" fill="currentColor"/></svg>
                            اپل
                        </button>
                    </div>
                </form>
            </div>

            <!-- فرم ورود -->
            <div id="login-form" class="form-wrapper">
                <h1>خوش آمدید</h1>
                <p class="subtitle">حساب کاربری ندارید؟ <a href="#" id="go-to-signup">ثبت‌نام کنید</a></p>

                <div class="tabs">
                    <button class="tab active" data-target="email">ورود با ایمیل</button>
                    <button class="tab" data-target="mobile">ورود با موبایل</button>
                </div>

                <form id="actual-login-form" novalidate>
                    <div class="input-group login-input" id="email-input-group">
                        <input type="email" id="login-email" placeholder=" " required>
                        <label for="login-email">ایمیل</label>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                    </div>

                    <div class="input-group login-input" id="mobile-input-group" style="display: none;">
                        <input type="tel" id="login-mobile" placeholder=" " dir="ltr" style="text-align: right;">
                        <label for="login-mobile">شماره موبایل</label>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                        </span>
                    </div>

                    <div class="input-group password-group">
                        <input type="password" id="login-password" placeholder=" " required>
                        <label for="login-password">رمز عبور را وارد کنید</label>
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <span class="toggle-password" onclick="togglePassword('login-password', this)">👁</span>
                    </div>

                    <div class="forgot-password">
                        <a href="#">فراموشی رمز عبور؟</a>
                    </div>

                    <button type="submit" class="submit-btn magnetic">
                        <span class="btn-text">ورود به حساب</span>
                        <span class="loader"></span>
                    </button>

                    <div class="divider"><span>یا ورود با</span></div>

                    <div class="social-login">
                        <button type="button" class="social-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                            گوگل
                        </button>
                        <button type="button" class="social-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.74 1.51.06 2.76.62 3.58 1.77-3.09 1.91-2.6 5.73.49 7.13-.69 1.73-1.59 3.43-2.74 4.01zm-3.08-14.1c.56-2.05 2.22-3.44 3.79-3.38.26 1.96-1.6 3.58-3.79 3.38z" fill="currentColor"/></svg>
                            اپل
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
